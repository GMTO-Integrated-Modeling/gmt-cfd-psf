[package]
name = "piston-batch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
arrow = "55.2"
clap = { workspace = true, features = ["env"] }
dotenvy.workspace = true
env_logger = "0.11.8"
futures = "0.3"
gmt-lom = { version = "2.6.1", features = ["object_store"] }
log = "0.4"
object_store = { workspace = true, features = ["aws"] }
parquet = "55.2"
tokio = { workspace = true, features = ["full"] }
