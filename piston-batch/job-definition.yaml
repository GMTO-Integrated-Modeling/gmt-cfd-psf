# AWS Batch job definition (EC2) of the segment piston, replace <ACCOUNT> and <REGION>
# (the compute region) or use deploy-piston-batch.sh:
#   aws batch register-job-definition --cli-input-yaml file://piston-batch/job-definition.yaml
# A single job processes all the CFD cases of a trade study,
# the study is set with --container-overrides '{"environment":[{"name":"FEM","value":"FEM/<FEM>/<STUDY>"}]}'
jobDefinitionName: piston-batch
type: container
platformCapabilities:
  - EC2
timeout:
  attemptDurationSeconds: 7200
retryStrategy:
  attempts: 2
containerProperties:
  image: <ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/gmto.im/piston-batch:latest
  command: ["--concurrency", "6", "--loop", "fsm"]
  jobRoleArn: arn:aws:iam::<ACCOUNT>:role/piston-batch-job
  resourceRequirements:
    - type: VCPU
      value: "8"
    - type: MEMORY
      value: "16000"
  environment:
    # the bucket is in us-east-1, whatever the compute region
    - name: BUCKET
      value: gmto.cfd.2025
    - name: REGION
      value: us-east-1
    - name: FEM
      value: FEM/20250506_1715_zen_30_M1_202110_FSM_202305_Mount_202305_pier_202411_M1_actDamping
    - name: LOM_SENSITIVITIES
      value: LOM/optical_sensitivities.rs.bin
    - name: RUST_LOG
      value: info
